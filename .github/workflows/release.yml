# Builds the mod and publishes it as a GitHub Release. Triggers either by
# pushing a version tag (e.g. v1.1.0), or manually via workflow_dispatch
# (e.g. `gh workflow run release.yml -f version=v1.1.0`) for cases where the
# tag itself still needs to be created as part of the run.

name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.1.0). Created if it does not exist yet.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --title "$TAG" \
            --generate-notes
